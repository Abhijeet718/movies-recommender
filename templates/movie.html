<!DOCTYPE html>
<html>
<head>
    <title>{{ movie.title }} - Details</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        /* Details Page Specific CSS */
        .backdrop {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background-image: url('{{ movie.backdrop }}');
            background-size: cover;
            background-position: center;
            opacity: 0.2;
            z-index: -1;
        }
        .container {
            max-width: 1000px;
            margin: 50px auto;
            display: flex;
            gap: 40px;
            text-align: left;
            background: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 30px rgba(0,0,0,0.8);
        }
        .poster-col img {
            width: 300px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(229, 9, 20, 0.3);
        }
        .info-col h1 { margin-top: 0; font-size: 2.5em; }
        .info-col p { line-height: 1.6; color: #ccc; margin-bottom: 20px; font-size: 1.1em;}
        .metadata span { margin-right: 15px; color: #e50914; font-weight: bold; }
        .cast-list { color: #fff; font-style: italic; }
        .trailer { margin-top: 30px; }
        
        @media (max-width: 800px) {
            .container { flex-direction: column; align-items: center; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="backdrop"></div>

    <a href="/" style="color: white; text-decoration: none; position: absolute; top: 20px; left: 20px; font-size: 1.2em;">
        ← Back to Search
    </a>

    <div class="container">
        <div class="poster-col">
            <img src="{{ movie.poster }}" alt="{{ movie.title }}">
        </div>

        <div class="info-col">
            <h1>{{ movie.title }} ({{ movie.year }})</h1>
            
            <div class="metadata">
                <span>⭐ {{ movie.rating }} / 10</span>
                <span>🎥 {{ movie.director }}</span>
            </div>

            <div class="genres" style="justify-content: flex-start; margin: 20px 0;">
                {% for genre in movie.genres %}
                    <span class="badge">{{ genre }}</span>
                {% endfor %}
            </div>

            <h3>Overview</h3>
            <p>{{ movie.overview }}</p>

            <h3>Top Cast</h3>
            <p class="cast-list">{{ movie.cast | join(', ') }}</p>

            {% if movie.trailer_key %}
            <div class="trailer">
                <h3>Trailer</h3>
                <iframe width="100%" height="315" src="https://www.youtube.com/embed/{{ movie.trailer_key }}" frameborder="0" allowfullscreen style="border-radius: 10px;"></iframe>
            </div>
            {% endif %}
        </div>
    </div>

</body>
</html>
